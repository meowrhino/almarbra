<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prueba · la portada tejida</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../css/style.css">
<style>
  /* La portada de verdad. Los proyectos siguen cayendo donde les da la
     gana en cada carga —eso es lo bueno y no se toca—; lo que cambia es
     el hilo: ya no es una raya de punto a punto, es un cable. Sale por
     un conector de la derecha, entra por uno de la izquierda y si el
     otro le queda detrás, da la vuelta. Eso es lo que separa un mapa de
     nodos de una constelación.

     Se cablean los que quedan cerca, y ya está. */

  .projects .hilos {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }

  .projects .hilos path {
    fill: none;
    stroke: rgba(255, 255, 255, .3);
    stroke-width: 1.1;
    stroke-linecap: round;
    transition: stroke .25s, stroke-width .25s;
  }

  .projects .hilos path.vivo {
    stroke: rgba(255, 255, 255, .9);
    stroke-width: 1.6;
  }

  /* los proyectos, por encima del cable. Y cada ficha del ancho de lo
     que lleva dentro, no del 19% fijo: así el conector queda pegado al
     nombre y no a media pantalla de distancia. */
  .projects ul.is-scattered li { z-index: 1; width: auto; max-width: 24%; }
  /* el nombre, de una línea: una ficha de nodo no parte palabras */
  .projects ul.is-scattered span { white-space: nowrap; }

  /* los conectores: un punto a cada lado, de donde sale el cable */
  .projects ul.is-scattered a { position: relative; }
  .projects ul.is-scattered a::before,
  .projects ul.is-scattered a::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 5px; height: 5px;
    margin-top: -2.5px;
    border: 1px solid rgba(255, 255, 255, .4);
    background: var(--bg);
    border-radius: 50%;
    transition: border-color .25s;
  }
  .projects ul.is-scattered a::before { left: -8px; }
  .projects ul.is-scattered a::after { right: -8px; }
  .projects ul.is-scattered li:hover a::before,
  .projects ul.is-scattered li:hover a::after { border-color: rgba(255, 255, 255, .9); }

  .volver {
    position: fixed;
    top: .9rem; right: 1.2rem;
    z-index: 5;
    font-size: 11px;
    color: rgba(255, 255, 255, .3);
  }
  .volver:hover { color: #fff; }
</style>
</head>
<body class="home">
<h1 class="sr-only">almudena gonzalez</h1>
<a class="volver" href="index.html">pruebas</a>

<section class="hero">
  <img src="../img/portada/portada.webp"
       srcset="../img/portada/portada-400.webp 400w, ../img/portada/portada-800.webp 800w, ../img/portada/portada.webp 1333w"
       sizes="100vw" width="1333" height="2000" alt="" fetchpriority="high" decoding="async">
  <a class="enter" href="#proyectos">entrar</a>
</section>

<div id="proyectos">
  <p class="signature">almudena gonzalez</p>
  <nav class="projects">
    <svg class="hilos"></svg>
    <ul></ul>
  </nav>
</div>

<script src="datos.js"></script>
<script>
/* El reparto es el de js/scatter.js, tal cual: medir, tirar posiciones y
   descartar las que pisan a otro. Encima, el cableado. Aquí la lista se
   pinta desde datos.js porque es una prueba; en el sitio ya viene hecha
   en el HTML. */
(() => {
  const { proyectos } = window.TEJIDO;
  const list = document.querySelector('.projects ul');
  const svg = document.querySelector('.projects .hilos');
  const NS = 'http://www.w3.org/2000/svg';

  list.innerHTML = proyectos.map((p) => `
    <li><a href="../${p.slug}/">
      <img src="../${p.mini}" alt="" loading="lazy" decoding="async">
      <span>${p.corto}</span>
    </a></li>`).join('');

  const items = [...list.children];

  /* ── el reparto (js/scatter.js) ─────────────────────────────────── */
  const TRIES = 500;
  const GAPS = [24, 12, 6, 0];

  function overlap(a, b, gap) {
    const dx = Math.min(a.x + a.w + gap, b.x + b.w) - Math.max(a.x - gap, b.x);
    const dy = Math.min(a.y + a.h + gap, b.y + b.h) - Math.max(a.y - gap, b.y);
    return dx > 0 && dy > 0 ? dx * dy : 0;
  }

  /* se deja un dedo de aire en los bordes: los conectores asoman por
     fuera de la ficha y si no se cortan contra el borde */
  const AIRE = 10;

  function place(boxes, area) {
    const placed = [];
    for (const box of boxes) {
      const spanX = Math.max(0, area.w - box.w - AIRE * 2);
      const spanY = Math.max(0, area.h - box.h - AIRE * 2);
      let spot = null, best = null, bestCost = Infinity;
      for (const gap of GAPS) {
        for (let t = 0; t < TRIES; t++) {
          const c = { x: AIRE + Math.random() * spanX, y: AIRE + Math.random() * spanY, w: box.w, h: box.h };
          const cost = placed.reduce((s, p) => s + overlap(c, p, gap), 0);
          if (cost === 0) { spot = c; break; }
          if (cost < bestCost) { bestCost = cost; best = c; }
        }
        if (spot) break;
      }
      placed.push(spot || best);
    }
    return placed;
  }

  /* ── quién se cablea con quién ─────────────────────────────────────
     Por proximidad y nada más: se cablean los pares que quedan cerca.
     «Cerca» no puede ser una medida fija —en una ventana grande todo
     queda lejos y en una pequeña todo cerca—, así que se mide en cada
     reparto: se ordenan todas las distancias y se corta donde salen
     unos dos cables y medio por proyecto. Ni una maraña ni cuatro
     islas. */
  const CABLES_POR_NUDO = 1.3;

  function cerca(nudos) {
    const pares = [];
    for (let i = 0; i < nudos.length; i++) {
      for (let j = i + 1; j < nudos.length; j++) {
        pares.push({ i, j, d: Math.hypot(nudos[i].x - nudos[j].x, nudos[i].y - nudos[j].y) });
      }
    }
    pares.sort((a, b) => a.d - b.d);
    const cuantos = Math.min(pares.length, Math.round(nudos.length * CABLES_POR_NUDO));
    const umbral = pares[cuantos - 1].d;
    const elegidos = new Map(pares.filter((p) => p.d <= umbral).map((p) => [`${p.i}-${p.j}`, p]));

    /* y que no se quede nadie solo: quien no haya pillado cable por
       cercanía se cablea igual con el que tenga más a mano */
    nudos.forEach((_, i) => {
      if ([...elegidos.values()].some((p) => p.i === i || p.j === i)) return;
      const mano = pares.find((p) => p.i === i || p.j === i);
      if (mano) elegidos.set(`${mano.i}-${mano.j}`, mano);
    });

    return [...elegidos.values()];
  }

  /* El cable sale por el conector de la derecha y entra por el de la
     izquierda, siempre en horizontal. Si el otro le queda detrás, sale
     igual y da la vuelta: eso es lo que hace un editor de nodos y lo
     que una constelación no hace nunca. */
  function cable(a, b) {
    const [de, hacia] = a.x <= b.x ? [a, b] : [b, a];
    const x1 = de.x + de.w / 2 + 8, y1 = de.y;
    const x2 = hacia.x - hacia.w / 2 - 8, y2 = hacia.y;
    const tira = Math.min(150, Math.max(45, (x2 - x1) * .5, (x1 - x2) * .5));
    return `M${x1},${y1} C${x1 + tira},${y1} ${x2 - tira},${y2} ${x2},${y2}`;
  }

  function reset() {
    list.classList.remove('is-scattered');
    for (const item of items) { item.style.left = ''; item.style.top = ''; }
    svg.replaceChildren();
  }

  function repartir() {
    list.classList.add('is-scattered');
    for (const item of items) { item.style.left = ''; item.style.top = ''; }

    const area = list.getBoundingClientRect();
    const cajas = items.map((item) => {
      const r = item.getBoundingClientRect();
      return { w: r.width, h: r.height };
    });

    /* sin superficie que repartir, la lista de siempre */
    const cabe = cajas.every((c) => c.w > 0 && c.h > 0 && c.w <= area.width && c.h <= area.height);
    if (!cabe) { reset(); return; }

    const sitios = place(cajas, { w: area.width, h: area.height });
    sitios.forEach((s, i) => {
      items[i].style.left = `${s.x}px`;
      items[i].style.top = `${s.y}px`;
    });

    /* el cable entra y sale por el centro de los lados */
    const nudos = sitios.map((s) => ({ x: s.x + s.w / 2, y: s.y + s.h / 2, w: s.w, h: s.h }));
    svg.replaceChildren();
    for (const { i, j } of cerca(nudos)) {
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', cable(nudos[i], nudos[j]));
      path.dataset.de = i;
      path.dataset.a = j;
      svg.appendChild(path);
    }
  }

  repartir();
  addEventListener('load', repartir, { once: true });

  let pendiente;
  addEventListener('resize', () => {
    clearTimeout(pendiente);
    pendiente = setTimeout(repartir, 150);
  });

  /* Al pasar por un proyecto se encienden sus cables. */
  list.addEventListener('pointerover', (e) => {
    const li = e.target.closest('li');
    const i = li ? items.indexOf(li) : -1;
    for (const path of svg.children) {
      path.classList.toggle('vivo', i >= 0 && (+path.dataset.de === i || +path.dataset.a === i));
    }
  });
  list.addEventListener('pointerleave', () => {
    for (const path of svg.children) path.classList.remove('vivo');
  });

  /* la tecla r reparte otra vez, para mirar cómo sale */
  addEventListener('keydown', (e) => { if (e.key === 'r') repartir(); });
})();
</script>
</body>
</html>
