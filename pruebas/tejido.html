<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prueba · tejido vivo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="comun.css">
<style>
  /* Una tela colgada: los proyectos son los nudos y los hilos tiran de
     ellos. Nunca se está quieta; al arrastrar un nudo se deforma
     entera y vuelve a asentarse. */
  #tela { position: fixed; inset: 0; touch-action: none; }
  #hilos { position: absolute; inset: 0; width: 100%; height: 100%; }
  #hilos path { fill: none; stroke-linecap: round; transition: opacity .25s; }

  .nudo {
    position: absolute;
    left: 0; top: 0;
    width: 62px; height: 62px;
    margin: -31px 0 0 -31px;
    cursor: grab;
    transition: opacity .25s;
  }
  .nudo:active { cursor: grabbing; }

  .nudo img {
    width: 100%; height: 100%;
    object-fit: cover;
    border: 1px solid var(--line);
    transition: transform .25s, border-color .25s;
  }

  .nudo b {
    position: absolute;
    top: calc(100% + 7px);
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-weight: 400;
    font-size: 10px;
    letter-spacing: .03em;
    color: var(--dim);
    opacity: 0;
    transition: opacity .25s, color .25s;
    pointer-events: none;
  }

  .nudo.vivo img { transform: scale(1.35); border-color: rgba(255, 255, 255, .6); }
  .nudo.vivo b { opacity: 1; color: var(--ink); }
  .nudo.apagado { opacity: .2; }

  /* con el ratón parado, los nombres asoman poco a poco */
  #tela.quieto .nudo b { opacity: .5; }

  #cuenta {
    position: fixed;
    left: 1.2rem; bottom: 2.6rem;
    font-size: 12px;
    color: var(--dim);
    pointer-events: none;
  }
  #cuenta b { font-weight: 400; color: var(--ink); }
</style>
</head>
<body>

<div class="barra">
  <span class="firma">almudena gonzalez · pruebas de tejido</span>
  <nav>
    <a href="cables.html">nodos</a>
    <a href="telar.html">telar</a>
    <a href="tejido.html" aria-current="page">tejido</a>
  </nav>
</div>

<div id="tela"><svg id="hilos"></svg></div>

<p id="cuenta"></p>
<p class="pie">
  la tela está viva: cada hilo es una persona que se repite y tira de los dos proyectos que
  cose. arrastra un nudo y se deforma entera. clic para entrar.
</p>

<script src="datos.js"></script>
<script>
(() => {
  const { proyectos, gente, enlaces } = window.TEJIDO;

  const color = new Map(gente.map((g, i) => [
    g.name,
    `hsl(${(i * 137.5) % 360} 45% ${58 + (i % 3) * 6}%)`,
  ]));
  const colorTelar = 'rgba(255,255,255,.28)';

  const tela = document.getElementById('tela');
  const svg = document.getElementById('hilos');
  const cuenta = document.getElementById('cuenta');

  /* ── los nudos ───────────────────────────────────────────────────── */
  const nudos = proyectos.map((p, i) => {
    const a = i / proyectos.length * Math.PI * 2;
    const el = document.createElement('a');
    el.className = 'nudo';
    el.href = `../${p.slug}/`;
    el.innerHTML = `<img src="../${p.mini}" alt="" loading="lazy"><b>${p.corto}</b>`;
    tela.appendChild(el);
    return {
      ...p, el,
      x: innerWidth / 2 + Math.cos(a) * 220,
      y: innerHeight / 2 + Math.sin(a) * 180,
      vx: 0, vy: 0,
      /* cada nudo respira a su ritmo, para que la tela nunca se pare */
      fase: Math.random() * Math.PI * 2,
    };
  });
  const porSlug = new Map(nudos.map((n) => [n.slug, n]));

  /* ── los hilos: uno por persona compartida ──────────────────────── */
  const hebras = enlaces.flatMap((e) =>
    e.por.map((quien, i, todos) => {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('stroke', e.tipo === 'telar' ? colorTelar : color.get(quien));
      path.setAttribute('stroke-width', e.tipo === 'telar' ? 1 : 1.3);
      if (e.tipo === 'telar') path.setAttribute('stroke-dasharray', '3 5');
      svg.appendChild(path);
      return {
        a: porSlug.get(e.a), b: porSlug.get(e.b), quien, tipo: e.tipo, path,
        /* las hebras del mismo par se separan un poco: madeja, no línea */
        desvio: (i - (todos.length - 1) / 2) * 9,
        /* el hilo mide según la ventana: la tela ocupa lo que hay */
        largo: Math.max(190, Math.min(innerWidth, innerHeight) * .42),
      };
    })
  );

  /* ── la física ───────────────────────────────────────────────────
     Muelles en los hilos, rechazo entre nudos, rozamiento y unas
     paredes blandas. Nada de librerías: son trece nudos. */
  const SEPARACION = 96;   /* lo que ocupa un nudo con su nombre */
  let agarrado = null;
  let reloj = 0;

  function paso() {
    reloj += 0.016;

    for (const n of nudos) {
      for (const m of nudos) {
        if (n === m) continue;
        const dx = n.x - m.x, dy = n.y - m.y;
        const d = Math.hypot(dx, dy) || 1;
        const f = 34000 / (d * d);
        n.vx += dx / d * f; n.vy += dy / d * f;
        /* dos nudos nunca se pisan: por debajo de esta distancia se
           empujan a la fuerza, no por muelle */
        if (d < SEPARACION) { n.x += dx / d * (SEPARACION - d) * .5; n.y += dy / d * (SEPARACION - d) * .5; }
      }
      /* respirar: un vaivén lentísimo que mantiene la tela temblando */
      n.vx += Math.cos(reloj * .5 + n.fase) * .04;
      n.vy += Math.sin(reloj * .4 + n.fase * 1.7) * .04;
    }

    for (const h of hebras) {
      const dx = h.b.x - h.a.x, dy = h.b.y - h.a.y;
      const d = Math.hypot(dx, dy) || 1;
      const f = (d - h.largo) * .0035;
      h.a.vx += dx / d * f; h.a.vy += dy / d * f;
      h.b.vx -= dx / d * f; h.b.vy -= dy / d * f;
    }

    /* el aire que se deja: arriba cabe la barra, abajo el pie */
    const lado = 90, arriba = 120, abajo = 110;
    for (const n of nudos) {
      if (n === agarrado) { n.vx = n.vy = 0; continue; }
      /* paredes blandas: en vez de rebotar, empujan hacia dentro */
      if (n.x < lado) n.vx += (lado - n.x) * .06;
      if (n.x > innerWidth - lado) n.vx += (innerWidth - lado - n.x) * .06;
      if (n.y < arriba) n.vy += (arriba - n.y) * .06;
      if (n.y > innerHeight - abajo) n.vy += (innerHeight - abajo - n.y) * .06;

      n.vx *= .88; n.vy *= .88;
      n.x += n.vx; n.y += n.vy;
    }

    /* la tela entera se recoloca en el centro de la ventana, despacio:
       si no, se va escurriendo hacia una esquina */
    const cx = nudos.reduce((s, n) => s + n.x, 0) / nudos.length;
    const cy = nudos.reduce((s, n) => s + n.y, 0) / nudos.length;
    const dx = (innerWidth / 2 - cx) * .02, dy = (innerHeight / 2 - 20 - cy) * .02;
    for (const n of nudos) { n.x += dx; n.y += dy; }

    for (const n of nudos) n.el.style.transform = `translate(${n.x}px, ${n.y}px)`;

    /* El hilo cuelga: cuanto más flojo, más panza. Tenso, recto. */
    for (const h of hebras) {
      const dx = h.b.x - h.a.x, dy = h.b.y - h.a.y;
      const d = Math.hypot(dx, dy) || 1;
      const flojo = Math.max(0, h.largo - d);
      const mx = (h.a.x + h.b.x) / 2, my = (h.a.y + h.b.y) / 2;
      /* la panza cae hacia abajo, y el desvío se reparte de canto */
      const cx = mx - dy / d * h.desvio;
      const cy = my + dx / d * h.desvio + flojo * .5 + 14;
      h.path.setAttribute('d', `M${h.a.x},${h.a.y} Q${cx},${cy} ${h.b.x},${h.b.y}`);
    }

    requestAnimationFrame(paso);
  }
  paso();

  /* ── mirar y arrastrar ──────────────────────────────────────────── */
  function resaltar(nudo) {
    for (const n of nudos) {
      n.el.classList.toggle('vivo', n === nudo);
      n.el.classList.toggle('apagado', !!nudo && n !== nudo &&
        !hebras.some((h) => (h.a === nudo && h.b === n) || (h.b === nudo && h.a === n)));
    }
    for (const h of hebras) {
      h.path.style.opacity = !nudo ? '' : (h.a === nudo || h.b === nudo ? 1 : .08);
    }
    if (!nudo) { cuenta.textContent = ''; return; }
    const suyos = hebras.filter((h) => h.a === nudo || h.b === nudo);
    const quienes = [...new Set(suyos.filter((h) => h.tipo !== 'telar').map((h) => h.quien))];
    cuenta.innerHTML = `<b>${nudo.titulo.toLowerCase()}</b>` +
      (quienes.length
        ? ` · cosido por ${quienes.map((q) => `<span style="color:${color.get(q)}">${q.toLowerCase()}</span>`).join(' · ')}`
        : ' · serie de telar');
  }

  let movido = 0, quieto;
  tela.classList.add('quieto');   /* al abrir, los nombres a la vista */
  tela.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.nudo');
    agarrado = el ? nudos.find((n) => n.el === el) : null;
    movido = 0;
    if (agarrado) tela.setPointerCapture(e.pointerId);
  });

  tela.addEventListener('pointermove', (e) => {
    tela.classList.remove('quieto');
    clearTimeout(quieto);
    quieto = setTimeout(() => tela.classList.add('quieto'), 1800);

    if (agarrado) {
      movido += Math.abs(e.movementX) + Math.abs(e.movementY);
      agarrado.x = e.clientX; agarrado.y = e.clientY;
      return;
    }
    const el = e.target.closest('.nudo');
    resaltar(el ? nudos.find((n) => n.el === el) : null);
  });

  const soltar = () => { agarrado = null; };
  tela.addEventListener('pointerup', soltar);
  tela.addEventListener('pointercancel', soltar);
  tela.addEventListener('pointerleave', () => { soltar(); resaltar(null); });
  tela.addEventListener('click', (e) => { if (movido > 6) e.preventDefault(); });
})();
</script>
</body>
</html>
